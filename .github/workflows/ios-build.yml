name: iOS app and widget build
on:
  push:
    paths: ['ios/App/**', 'ios/Shared/**', 'ios/Widget/**', 'ios/Core/**', 'ios/project.yml', '.github/workflows/ios-build.yml']
  workflow_dispatch:
concurrency:
  group: famical-ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Core unit tests
        run: swift test --package-path ios/Core
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build app and WidgetKit extension for iOS Simulator
        run: xcodebuild -project ios/Famical.xcodeproj -scheme Famical -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Archive simulator build (not installable on iPhone)
        run: ditto -c -k --sequesterRsrc --keepParent ios/build/Build/Products/Debug-iphonesimulator/Famical.app ios/Famical-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Famical-iOS-Simulator-NOT-iPhone-installer
          path: ios/Famical-iOS-Simulator.zip
          retention-days: 7
