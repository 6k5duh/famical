name: Famical
options:
  bundleIdPrefix: org.famical
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    FAMICAL_BUNDLE_PREFIX: org.famical.calendar.ios
    FAMICAL_APP_GROUP: group.org.famical.calendar.ios
    FAMICAL_KEYCHAIN_GROUP: $(AppIdentifierPrefix)$(FAMICAL_BUNDLE_PREFIX)
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Famical:
    type: application
    platform: iOS
    sources: [App, Shared, Core/Sources/FamicalCore]
    dependencies:
      - target: FamicalWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FAMICAL_BUNDLE_PREFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: 달력
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        FamicalAppGroup: $(FAMICAL_APP_GROUP)
        FamicalKeychainGroup: $(FAMICAL_KEYCHAIN_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: org.famical.calendar
            CFBundleURLSchemes: [famical]
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.security.application-groups: [$(FAMICAL_APP_GROUP)]
        keychain-access-groups: [$(FAMICAL_KEYCHAIN_GROUP)]
  FamicalWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared, Core/Sources/FamicalCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FAMICAL_BUNDLE_PREFIX).widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: 달력 위젯
        FamicalAppGroup: $(FAMICAL_APP_GROUP)
        FamicalKeychainGroup: $(FAMICAL_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Widget.entitlements
      properties:
        com.apple.security.application-groups: [$(FAMICAL_APP_GROUP)]
        keychain-access-groups: [$(FAMICAL_KEYCHAIN_GROUP)]
schemes:
  Famical:
    build:
      targets:
        Famical: all
