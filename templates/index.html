<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#285449"><link rel="manifest" href="/static/manifest.webmanifest"><link rel="icon" href="/static/icon.svg"><link rel="apple-touch-icon" href="/static/icon-192.png"><link rel="stylesheet" href="/static/style.css"><title>우리 가족 달력</title></head><body>
<header><div><small>함께 기록하는 하루</small><h1>우리 가족 달력</h1></div><span id="who"></span></header>
<main><section id="login" hidden><h2>가족 로그인</h2><p>가족 계정으로 로그인하면 공유 일정을 확인할 수 있어요.</p><form id="loginForm"><label>아이디<input name="username" autocomplete="username" required maxlength="40"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required maxlength="200"></label><button>로그인</button></form></section>
<section id="calendar" hidden><div class="toolbar"><div class="navigation"><button id="prev" aria-label="이전 달">‹</button><h2 id="monthTitle"></h2><button id="next" aria-label="다음 달">›</button><button id="today">오늘</button></div><button id="add">+ 일정 추가</button></div><div class="settings"><label class="inline">일정 보기<select id="eventView"><option value="all">전체 일정</option><option value="mine">내 일정</option></select></label><label class="inline"><input id="shiftOn" type="checkbox">교대 표시</label><label class="inline">내 교대조<select id="team"><option value="A">A조</option><option value="B">B조</option></select></label><span id="legend"><i class="night"></i>야간 <i class="day"></i>주간</span></div><div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="grid"></div><p class="hint">날짜를 누르면 일정을 등록할 수 있어요. 공개 범위를 선택해 가족과 공유하거나 나에게만 보관할 수 있어요. 음력은 1900~2050년 범위에서 표시됩니다.</p><div class="footer"><span id="sync"></span><button id="refresh">새로고침</button><button id="passwordButton">비밀번호 변경</button><button id="logout">로그아웃</button></div></section>
<p id="message" role="status" aria-live="polite"></p></main>
<dialog id="editor"><form id="eventForm"><h2 id="editTitle">가족 일정</h2><input name="id" type="hidden"><label>제목<input name="title" maxlength="100" required></label><label>날짜 기준<select name="calendar_type" id="calendarType"><option value="solar">양력</option><option value="lunar">음력</option></select></label><div class="twocol"><label id="dateLabel">시작일 (YYYY-MM-DD)<input name="day" type="text" placeholder="2026-11-17" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" required></label><label>종료일 (비우면 시작일과 같음)<input name="end_day" type="text" placeholder="2026-11-19" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}"></label></div><div class="twocol"><label>막대 색상<select name="color"><option value="sage">초록</option><option value="blue">파랑</option><option value="rose">분홍</option><option value="amber">주황</option><option value="violet">보라</option></select></label><label>시간 (비우면 종일)<input name="clock" type="time"></label></div><label class="inline"><input name="annual" type="checkbox">매년 반복 (생일·제사 등)</label><label id="leapLabel" class="inline" hidden><input name="leap" type="checkbox">윤달 날짜</label><p id="dateHelp" class="hint">양력 날짜를 입력하세요.</p><label>메모<textarea name="note" maxlength="2000" rows="4"></textarea></label><fieldset id="visibilityField"><legend>공개 범위</legend><div class="visibility-options"><label><input type="radio" name="visibility" value="private">나에게만 보이기</label><label><input type="radio" name="visibility" value="shared" checked>모두에게 보이기</label></div><small>‘나에게만’ 일정은 작성자 본인만 볼 수 있습니다.</small></fieldset><p id="author"></p><p id="editorError" role="alert"></p><div class="actions"><button type="button" id="remove" class="danger">삭제</button><button type="button" id="close" class="secondary">닫기</button><button id="save">저장</button></div></form></dialog>
<dialog id="passwordDialog"><form id="passwordForm"><h2>비밀번호 변경</h2><label>현재 비밀번호<input name="old" type="password" autocomplete="current-password" required></label><label>새 비밀번호 (12자 이상)<input name="new" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></label><p id="passwordError" role="alert"></p><div class="actions"><button type="button" id="passwordClose" class="secondary">닫기</button><button>변경</button></div></form></dialog><script type="module" src="/static/app.js"></script></body></html>
